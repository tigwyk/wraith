[workspace]
resolver = "3"
members = ["crates/proto", "crates/config", "crates/server", "crates/client"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
wraith-proto = { path = "crates/proto" }
wraith-config = { path = "crates/config" }
wraith-server = { path = "crates/server" }
libghostty-vt = "=0.2.2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
crossbeam-channel = "0.5"

[profile.release]
lto = "thin"
