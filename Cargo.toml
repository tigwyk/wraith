[workspace]
resolver = "3"
members = ["crates/proto", "crates/config", "crates/ipc", "crates/server", "crates/client", "crates/cli"]
# Vendored libghostty-rs keeps its own workspace (see vendor/libghostty-rs/VENDORED.md).
exclude = ["vendor"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
wraith-proto = { path = "crates/proto" }
wraith-config = { path = "crates/config" }
wraith-server = { path = "crates/server" }
wraith-ipc = { path = "crates/ipc" }
libghostty-vt = { path = "vendor/libghostty-rs/crates/libghostty-vt" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
crossbeam-channel = "0.5"
tracing = "0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus"] }

[profile.release]
lto = "thin"
